appId: com.georgefromgib.hiittimer
---
# "Later" path: skip commits nothing, still lands on the default Folders screen
# (folders are enabled by default, independent of the onboarding modal).
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: ".*:8081.*"
    label: Connect to the Metro dev server if the dev-launcher home shows
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- assertVisible:
    text: "Welcome to Clear HiiT"
- tapOn:
    id: "onboarding-later"
- assertVisible: "My Sessions"

# "Get Started" (confirm) path: same landing screen, different button.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: ".*:8081.*"
    label: Connect to the Metro dev server if the dev-launcher home shows
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- assertVisible:
    id: "onboarding-confirm"
- tapOn:
    id: "onboarding-confirm"
- assertVisible: "My Sessions"
