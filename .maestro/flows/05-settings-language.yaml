appId: com.georgefromgib.hiittimer
---
- runFlow: ../subflows/reset-and-launch.yaml
- tapOn:
    id: "settings-btn"
- assertVisible: "Settings"

- tapOn:
    id: "settings-toggle-haptic"
- tapOn:
    id: "settings-toggle-keepawake"

- tapOn:
    id: "settings-lang-es"
- assertVisible: "Ajustes"

- tapOn:
    id: "settings-lang-en"
- assertVisible: "Settings"
