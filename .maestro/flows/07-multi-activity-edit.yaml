appId: com.georgefromgib.hiittimer
---
- runFlow: ../subflows/reset-and-launch.yaml

# Run session — easy mode, exercises the shared PickerModal via the rounds field.
- tapOn:
    id: "add-btn"
- tapOn:
    id: "type-run"
- assertVisible: "New Session"
- assertVisible: "Treadmill"
- tapOn:
    id: "edit-name"
- inputText: "Maestro Run Test"
- tapOn:
    id: "edit-rounds-picker"
- assertVisible:
    id: "picker-confirm"
- tapOn:
    id: "picker-confirm"
- tapOn:
    id: "edit-save"
- assertVisible: "Maestro Run Test"

# Circuit session — different config layout and preview label.
- tapOn:
    id: "add-btn"
- tapOn:
    id: "type-circuit"
- assertVisible: "New Session"
- assertVisible: "Circuit"
- tapOn:
    id: "edit-name"
- inputText: "Maestro Circuit Test"
# Circuit sessions start with zero intervals; save requires at least one.
- tapOn:
    id: "edit-add-interval"
- tapOn: "WRK"
- tapOn:
    id: "edit-save"
- assertVisible: "Maestro Circuit Test"
